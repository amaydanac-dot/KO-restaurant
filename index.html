<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KO — Salteados Japoneses | Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0906;
    --bg-panel:#161210;
    --bg-panel-2:#1f1a16;
    --line:#332a23;
    --ember-1:#e8341c;
    --ember-2:#f5a623;
    --gold:#d9a441;
    --cream:#f4efe6;
    --muted:#9c9187;
    --good:#4caf7d;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.02em;
    margin:0;
  }
  .ember-text{
    background:linear-gradient(90deg,var(--ember-1),var(--ember-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- HEADER ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:rgba(11,9,6,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1100px;margin:0 auto;
    display:flex;align-items:center;justify-content:center;
    padding:12px 20px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{height:40px;width:40px;object-fit:contain;border-radius:50%;}
  .brand-name{font-size:22px;font-weight:600;letter-spacing:0.08em;}
  .brand-sub{font-size:9px;color:var(--muted);letter-spacing:0.18em;text-transform:uppercase;margin-top:-2px;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    overflow:hidden;
    padding:64px 20px 40px;
    text-align:center;
  }
  .hero::before{
    content:"";
    position:absolute;inset:-20% -10% auto -10%;height:130%;
    background:radial-gradient(ellipse at 50% 0%, rgba(232,52,28,0.28), transparent 60%);
    pointer-events:none;
  }
  .hero-inner{position:relative;max-width:640px;margin:0 auto;}
  .eyebrow{
    font-size:11px;letter-spacing:0.3em;color:var(--gold);
    text-transform:uppercase;margin-bottom:14px;font-weight:600;
  }
  .hero h1{font-size:clamp(38px,9vw,64px);line-height:0.98;}
  .hero p{color:var(--muted);margin-top:16px;font-size:15px;line-height:1.6;}
  .hero-cta{
    margin-top:26px;display:inline-flex;gap:12px;flex-wrap:wrap;justify-content:center;
  }
  .btn-primary{
    background:linear-gradient(90deg,var(--ember-1),var(--ember-2));
    color:#1a0e05;border:none;padding:13px 26px;border-radius:999px;
    font-weight:700;font-size:14px;cursor:pointer;letter-spacing:0.02em;
    box-shadow:0 8px 24px rgba(232,52,28,0.25);
  }
  .btn-secondary{
    background:transparent;border:1px solid var(--line);color:var(--cream);
    padding:13px 26px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    transition:border-color .2s;
  }
  .btn-secondary:hover{border-color:var(--gold);}
  .cart-count{
    background:linear-gradient(90deg,var(--ember-1),var(--ember-2));
    color:#1a0e05;
    font-size:11px;font-weight:700;
    min-width:19px;height:19px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    padding:0 5px;
  }

  /* flame divider */
  .flame-rule{
    height:2px;max-width:120px;margin:34px auto 0;
    background:linear-gradient(90deg,transparent,var(--ember-1),var(--ember-2),transparent);
  }

  /* ---------- CATEGORY TABS ---------- */
  .tabs-wrap{position:sticky;top:64px;z-index:30;background:var(--bg);padding:14px 20px;border-bottom:1px solid var(--line);}
  .tabs{max-width:1100px;margin:0 auto;display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;}
  .tab{
    flex:none;
    padding:9px 18px;border-radius:999px;border:1px solid var(--line);
    background:var(--bg-panel);color:var(--muted);font-size:13px;font-weight:600;
    cursor:pointer;white-space:nowrap;transition:.2s;
    text-transform:uppercase;letter-spacing:0.04em;
  }
  .tab.active{
    background:linear-gradient(90deg,var(--ember-1),var(--ember-2));
    color:#1a0e05;border-color:transparent;
  }

  /* ---------- MENU ---------- */
  main{max-width:1100px;margin:0 auto;padding:30px 20px 120px;}
  .menu-section{margin-bottom:44px;}
  .menu-section h2{
    font-size:26px;margin-bottom:4px;
  }
  .menu-section .section-desc{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .items-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;
  }
  .item-card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    display:flex;flex-direction:column;gap:10px;
    position:relative;
    transition:border-color .2s, transform .2s;
  }
  .item-card:hover{border-color:var(--gold);}
  .item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .item-name{font-weight:600;font-size:15.5px;line-height:1.3;}
  .item-price{
    font-family:'Oswald',sans-serif;font-size:16px;color:var(--gold);white-space:nowrap;
  }
  .item-desc{color:var(--muted);font-size:12.5px;line-height:1.5;flex:1;}
  .item-bottom{display:flex;justify-content:flex-end;align-items:center;margin-top:4px;}

  .qty-add{
    background:transparent;border:1px solid var(--gold);color:var(--gold);
    padding:7px 16px;border-radius:999px;font-size:12.5px;font-weight:700;
    cursor:pointer;text-transform:uppercase;letter-spacing:0.05em;transition:.2s;
  }
  .qty-add:hover{background:var(--gold);color:#1a0e05;}
  .qty-stepper{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-panel-2);border-radius:999px;padding:4px 6px;
  }
  .qty-stepper button{
    width:26px;height:26px;border-radius:50%;border:none;
    background:linear-gradient(90deg,var(--ember-1),var(--ember-2));
    color:#1a0e05;font-weight:700;font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .qty-stepper span{font-weight:700;font-size:14px;min-width:14px;text-align:center;}

  /* ---------- FLOATING BAR ---------- */
  .float-bar{
    position:fixed;left:20px;right:20px;bottom:20px;z-index:35;
    max-width:1060px;margin:0 auto;
    background:linear-gradient(90deg,var(--ember-1),var(--ember-2));
    color:#1a0e05;border-radius:16px;
    padding:14px 18px;
    display:none;align-items:center;justify-content:space-between;
    box-shadow:0 12px 30px rgba(0,0,0,0.5);
    cursor:pointer;
  }
  .float-bar.show{display:flex;}
  .float-bar .fb-left{display:flex;flex-direction:column;}
  .float-bar .fb-left b{font-size:14px;}
  .float-bar .fb-left span{font-size:11px;opacity:0.8;}
  .float-bar .fb-right{font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;}

  /* ---------- CART DRAWER ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:50;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);
    background:var(--bg-panel);z-index:51;
    transform:translateX(100%);transition:transform .3s ease;
    display:flex;flex-direction:column;
    border-left:1px solid var(--line);
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    padding:20px;border-bottom:1px dashed var(--line);
    display:flex;justify-content:space-between;align-items:center;
  }
  .drawer-head h3{font-size:20px;}
  .drawer-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 20px;}
  .ticket-empty{color:var(--muted);font-size:13px;text-align:center;padding:60px 10px;}

  .cart-line{
    display:flex;gap:12px;padding:14px 0;border-bottom:1px dashed var(--line);
  }
  .cart-line:last-child{border-bottom:none;}
  .cart-line-info{flex:1;}
  .cart-line-info .name{font-weight:600;font-size:14px;}
  .cart-line-info .unit{color:var(--muted);font-size:11.5px;margin-top:2px;}
  .cart-line-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .cart-line-price{font-family:'Oswald',sans-serif;color:var(--gold);font-size:14px;}
  .remove-link{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;text-decoration:underline;}

  .drawer-foot{border-top:1px dashed var(--line);padding:18px 20px 22px;}
  .totals-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .totals-row.total{color:var(--cream);font-weight:700;font-size:17px;font-family:'Oswald',sans-serif;margin-top:8px;}

  form.checkout{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;background:var(--bg-panel-2);border:1px solid var(--line);color:var(--cream);
    padding:10px 12px;border-radius:8px;font-size:13.5px;font-family:'Inter',sans-serif;
  }
  .field textarea{resize:vertical;min-height:50px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .radio-group{display:flex;gap:8px;}
  .radio-opt{
    flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;
    cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);transition:.2s;
  }
  .radio-opt.active{border-color:var(--gold);color:var(--gold);background:rgba(217,164,65,0.08);}

  .btn-send{
    margin-top:6px;width:100%;
    background:linear-gradient(90deg,var(--ember-1),var(--ember-2));
    color:#1a0e05;border:none;padding:14px;border-radius:10px;
    font-weight:700;font-size:14.5px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 6px 20px rgba(232,52,28,0.25);
  }
  .btn-send:disabled{opacity:0.4;cursor:not-allowed;}

  /* ---------- MODAL TICKET / COMPROBANTE ---------- */
  .modal{
    position:fixed;inset:0;z-index:60;
    display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.8);padding:20px;
  }
  .modal.open{display:flex;}
  .ticket-box{
    background:var(--bg-panel);border:1px solid var(--gold);
    border-radius:16px;max-width:380px;width:100%;padding:24px;
    text-align:left;
  }
  .ticket-header{text-align:center;border-bottom:1px dashed var(--line);padding-bottom:14px;margin-bottom:14px;}
  .ticket-header h3{font-size:22px;color:var(--gold);}
  .ticket-header p{font-size:12px;color:var(--muted);margin:4px 0 0;}
  .ticket-meta{font-size:13px;line-height:1.6;margin-bottom:14px;border-bottom:1px dashed var(--line);padding-bottom:12px;}
  .ticket-items{font-size:13px;margin-bottom:14px;}
  .ticket-row{display:flex;justify-content:space-between;margin-bottom:6px;}
  .ticket-total{display:flex;justify-content:space-between;font-family:'Oswald',sans-serif;font-size:18px;color:var(--gold);border-top:1px dashed var(--line);padding-top:10px;}
  .ticket-actions{display:flex;gap:10px;margin-top:20px;}
  .ticket-actions button{flex:1;padding:11px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;}
  .btn-print{background:var(--gold);color:#1a0e05;border:none;}
  .btn-done{background:var(--bg-panel-2);color:var(--cream);border:1px solid var(--line);}

  footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:0.03em;}

  @media(max-width:640px){
    .float-bar{left:14px;right:14px;bottom:14px;}
  }

  /* ---------- ESTILOS DE IMPRESIÓN ---------- */
  @media print {
    body * { visibility: hidden; }
    .ticket-box, .ticket-box * { visibility: visible; }
    .ticket-box {
      position: absolute; left: 0; top: 0; width: 100%;
      background: #fff; color: #000; border: none;
    }
    .ticket-header h3, .ticket-total { color: #000; }
    .ticket-actions { display: none; }
  }
</style>
</head>
